<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meshtastic DIY Builder Pro</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8; --accent: #22c55e; --border: #334155; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); max-width: 900px; margin: 24px auto; padding: 0 16px; }
    h1 { font-size: 1.5rem; margin-bottom: 4px; }
    p.sub { color: var(--muted); margin-top: 0; margin-bottom: 20px; font-size: 0.9rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    .card h2 { font-size: 1.05rem; margin: 0 0 12px 0; color: #38bdf8; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
    label { display: flex; flex-direction: column; font-size: 0.82rem; color: var(--muted); gap: 4px; }
    input, select, textarea { background: #0f172a; border: 1px solid var(--border); color: var(--text); padding: 8px; border-radius: 6px; font-size: 0.9rem; }
    textarea { width: 100%; box-sizing: border-box; font-family: monospace; min-height: 75px; }
    button { background: var(--accent); color: #052e16; font-weight: 700; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 1rem; }
    button.sec { background: #334155; color: var(--text); font-weight: 500; font-size: 0.85rem; padding: 8px 12px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    #status { margin-top: 12px; font-size: 0.92rem; }
    a { color: #38bdf8; }
    .hidden { display: none !important; }
    .hint { font-size: 0.78rem; color: #cbd5e1; background: #0f172a; padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; border-left: 3px solid #38bdf8; }
  </style>
</head>
<body>
  <h1>Meshtastic Custom Firmware Builder</h1>
  <p class="sub">Конструктор прошивок: ESP32 / S3 / C3 / C6 + nRF52840 + Ebyte E22 + OLED / TFT / Touch</p>

  <div class="card">
    <h2>1. Подключение к GitHub</h2>
    <div class="grid">
      <label>Владелец (User)<input id="gh_owner" placeholder="username" /></label>
      <label>Репозиторий<input id="gh_repo" value="meshtastic-builder" /></label>
      <label>GitHub Token (PAT)<input id="gh_token" type="password" placeholder="github_pat_..." /></label>
      <label>Тег Meshtastic<input id="fw_tag" value="v2.6.4" /></label>
    </div>
  </div>

  <div class="card">
    <h2>2. Микроконтроллер (MCU)</h2>
    <div class="grid">
      <label>Семейство чипа
        <select id="mcu" onchange="updateHints()">
          <option value="esp32s3">ESP32-S3 (N8/N16)</option>
          <option value="esp32">ESP32 (классический)</option>
          <option value="esp32c3">ESP32-C3</option>
          <option value="esp32c6">ESP32-C6</option>
          <option value="nrf52840">nRF52840 (ProMicro / Nice!Nano)</option>
        </select>
      </label>
    </div>
    <div id="mcu_hint" class="hint" style="margin-top:10px; margin-bottom:0;"></div>
  </div>

  <div class="card">
    <h2>3. Радиомодуль LoRa (Ebyte E22 / E220 / SX126x / SX127x)</h2>
    <div class="grid">
      <label>Модель модуля
        <select id="radio" onchange="toggleFields()">
          <option value="e22_900">Ebyte E22-900M (SX1262, 868/915 МГц)</option>
          <option value="e22_400">Ebyte E22-400M (SX1268, 433 МГц)</option>
          <option value="e220_llcc68">Ebyte E220-900M/400M (LLCC68)</option>
          <option value="sx1262">SX1262 (Ra-01SH / Wio-SX1262)</option>
          <option value="sx1276">SX1276 / SX1278 (Ra-02)</option>
        </select>
      </label>
      <label>LORA_SCK<input id="lora_sck" placeholder="напр. 12" /></label>
      <label>LORA_MISO<input id="lora_miso" placeholder="напр. 13" /></label>
      <label>LORA_MOSI<input id="lora_mosi" placeholder="напр. 11" /></label>
      <label>LORA_CS (NSS)<input id="lora_cs" placeholder="напр. 10" /></label>
      <label>LORA_RESET (NRST)<input id="lora_rst" placeholder="напр. 9" /></label>
      <label id="f_dio0" class="hidden">LORA_DIO0 (IRQ)<input id="lora_dio0" placeholder="напр. 26" /></label>
      <label id="f_dio1">LORA_DIO1 (IRQ)<input id="lora_dio1" placeholder="напр. 14" /></label>
      <label id="f_busy">SX126X_BUSY<input id="lora_busy" placeholder="напр. 8" /></label>
      <label id="f_rxen">SX126X_RXEN (для E22)<input id="lora_rxen" placeholder="пин RXEN" /></label>
      <label id="f_txen">SX126X_TXEN (для E22)<input id="lora_txen" placeholder="пин TXEN или -1" /></label>
      <label id="f_dio2">DIO2 как RF Switch
        <select id="dio2_rf_switch">
          <option value="1">Да (DIO2 управляет TX)</option>
          <option value="0">Нет (ручной TXEN)</option>
        </select>
      </label>
      <label id="f_tcxo">TCXO напряжение (DIO3)
        <select id="tcxo_voltage">
          <option value="1.8">1.8 В (стандарт E22)</option>
          <option value="2.4">2.4 В</option>
          <option value="3.3">3.3 В</option>
          <option value="0">0 В (без TCXO)</option>
        </select>
      </label>
      <label id="f_hp">Мощность модуля
        <select id="e22_high_power">
          <option value="0">Стандарт (до 22 dBm / E22-22S)</option>
          <option value="1">1 Вт (E22-30S, ограничивает выход до +22 dBm)</option>
        </select>
      </label>
    </div>
  </div>

  <div class="card">
    <h2>4. Дисплей и Тачскрин</h2>
    <div class="grid">
      <label>Тип экрана
        <select id="screen" onchange="toggleFields()">
          <option value="ssd1306">OLED I2C SSD1306 (0.96")</option>
          <option value="sh1106">OLED I2C SH1106 (1.3")</option>
          <option value="st7789">TFT SPI ST7789 (240x240 / 240x320)</option>
          <option value="ili9341">TFT SPI ILI9341 (240x320)</option>
          <option value="st7735">TFT SPI ST7735 (128x160)</option>
          <option value="eink">E-Ink SPI (SSD1680)</option>
          <option value="none">Без экрана</option>
        </select>
      </label>
      <label>Тачскрин
        <select id="touch" onchange="toggleFields()">
          <option value="none">Нет тачскрина</option>
          <option value="ft6336">Ёмкостный I2C FT6336 / FT6236</option>
          <option value="cst816">Ёмкостный I2C CST816S / CST816D</option>
          <option value="xpt2046">Резистивный SPI XPT2046</option>
        </select>
      </label>

      <!-- I2C пины (для OLED и I2C тача) -->
      <label class="grp_i2c">I2C_SDA<input id="i2c_sda" placeholder="напр. 17" /></label>
      <label class="grp_i2c">I2C_SCL<input id="i2c_scl" placeholder="напр. 18" /></label>

      <!-- SPI TFT / E-Ink пины -->
      <label class="grp_tft hidden">TFT_SCK (SCLK)<input id="tft_sck" placeholder="напр. 36" /></label>
      <label class="grp_tft hidden">TFT_MOSI (SDA)<input id="tft_mosi" placeholder="напр. 35" /></label>
      <label class="grp_tft hidden">TFT_MISO (для XPT2046)<input id="tft_miso" placeholder="опц." /></label>
      <label class="grp_tft hidden">TFT_CS<input id="tft_cs" placeholder="напр. 37" /></label>
      <label class="grp_tft hidden">TFT_DC (RS)<input id="tft_dc" placeholder="напр. 38" /></label>
      <label class="grp_tft hidden">TFT_RST<input id="tft_rst" placeholder="напр. 39" /></label>
      <label class="grp_tft hidden">TFT_BL (Подсветка / BUSY)<input id="tft_bl" placeholder="напр. 40" /></label>
      <label class="grp_tft hidden">Ширина (px)<input id="tft_width" value="240" /></label>
      <label class="grp_tft hidden">Высота (px)<input id="tft_height" value="320" /></label>

      <!-- Пины тачскрина -->
      <label class="grp_touch_spi hidden">TOUCH_CS (XPT2046)<input id="touch_cs" placeholder="напр. 41" /></label>
      <label class="grp_touch hidden">TOUCH_INT (IRQ)<input id="touch_int" placeholder="напр. 42" /></label>
      <label class="grp_touch_i2c hidden">TOUCH_RST<input id="touch_rst" placeholder="опц." /></label>
    </div>
  </div>

  <div class="card">
    <h2>5. Периферия и Дополнительно</h2>
    <div class="grid">
      <label>BUTTON_PIN (Кнопка)<input id="button_pin" placeholder="напр. 0" /></label>
      <label>LED_PIN (Светодиод)<input id="led_pin" placeholder="напр. 35" /></label>
      <label>GPS_RX (к TX модуля)<input id="gps_rx" placeholder="" /></label>
      <label>GPS_TX (к RX модуля)<input id="gps_tx" placeholder="" /></label>
      <label>BATTERY_PIN (ADC)<input id="battery_pin" placeholder="напр. 1" /></label>
      <label>ADC_MULTIPLIER<input id="adc_multiplier" value="2.0" /></label>
    </div>
    <div style="margin-top: 12px;">
      <label>Дополнительные #define (энкодер, буззер, ротация TFT и т.д.)
        <textarea id="extra_defines" placeholder="#define TFT_ROTATION 1&#10;#define PIN_BUZZER 4"></textarea>
      </label>
    </div>
  </div>

  <div class="row">
    <button id="buildBtn" onclick="triggerBuild()">Собрать прошивку в GitHub</button>
    <button class="sec" onclick="exportJson()">Скачать конфиг JSON</button>
    <button class="sec" onclick="importJson()">Загрузить JSON</button>
  </div>
  <div id="status"></div>

  <script>
    const FIELDS = [
      'mcu','radio','lora_sck','lora_miso','lora_mosi','lora_cs','lora_rst',
      'lora_dio0','lora_dio1','lora_busy','lora_rxen','lora_txen','dio2_rf_switch',
      'tcxo_voltage','e22_high_power','screen','touch','i2c_sda','i2c_scl',
      'tft_sck','tft_mosi','tft_miso','tft_cs','tft_dc','tft_rst','tft_bl',
      'tft_width','tft_height','touch_cs','touch_int','touch_rst',
      'button_pin','led_pin','gps_rx','gps_tx','battery_pin','adc_multiplier','extra_defines'
    ];

    function updateHints() {
      const mcu = document.getElementById('mcu').value;
      const hint = document.getElementById('mcu_hint');
      if (mcu === 'nrf52840') {
        hint.innerHTML = '💡 <b>nRF52840:</b> Пины указываются в формате Arduino/Adafruit (например, P0.24 = <b>24</b>, P1.04 = 32 + 4 = <b>36</b>). На выходе соберётся готовый файл <b>firmware.uf2</b>.';
      } else {
        hint.innerHTML = '💡 <b>ESP32:</b> Указываются стандартные номера GPIO (например, GPIO12 = <b>12</b>). На выходе соберутся <b>firmware.bin</b> и <b>firmware-update.bin</b>.';
      }
    }

    function toggleFields() {
      const radio = document.getElementById('radio').value;
      const is127x = radio === 'sx1276';
      const isE22 = radio.startsWith('e22');

      document.getElementById('f_dio0').classList.toggle('hidden', !is127x);
      ['f_busy','f_rxen','f_txen','f_dio2','f_tcxo'].forEach(id => {
        document.getElementById(id).classList.toggle('hidden', is127x);
      });
      document.getElementById('f_hp').classList.toggle('hidden', !isE22);

      const screen = document.getElementById('screen').value;
      const touch = document.getElementById('touch').value;
      const isOled = (screen === 'ssd1306' || screen === 'sh1106');
      const isTft = ['st7789','ili9341','st7735','eink'].includes(screen);
      const isI2cTouch = (touch === 'ft6336' || touch === 'cst816');
      const isSpiTouch = (touch === 'xpt2046');

      document.querySelectorAll('.grp_i2c').forEach(el => el.classList.toggle('hidden', !(isOled || isI2cTouch)));
      document.querySelectorAll('.grp_tft').forEach(el => el.classList.toggle('hidden', !isTft));
      document.querySelectorAll('.grp_touch').forEach(el => el.classList.toggle('hidden', touch === 'none'));
      document.querySelectorAll('.grp_touch_i2c').forEach(el => el.classList.toggle('hidden', !isI2cTouch));
      document.querySelectorAll('.grp_touch_spi').forEach(el => el.classList.toggle('hidden', !isSpiTouch));
    }

    function getConfig() {
      const cfg = {};
      FIELDS.forEach(id => cfg[id] = document.getElementById(id).value.trim());
      return cfg;
    }

    function loadSaved() {
      ['gh_owner','gh_repo','gh_token','fw_tag'].forEach(id => {
        if (localStorage.getItem(id)) document.getElementById(id).value = localStorage.getItem(id);
      });
      const savedCfg = localStorage.getItem('last_board_cfg');
      if (savedCfg) {
        const cfg = JSON.parse(savedCfg);
        FIELDS.forEach(id => { if (cfg[id] !== undefined) document.getElementById(id).value = cfg[id]; });
      }
      updateHints();
      toggleFields();
    }

    async function triggerBuild() {
      const owner = document.getElementById('gh_owner').value.trim();
      const repo = document.getElementById('gh_repo').value.trim();
      const token = document.getElementById('gh_token').value.trim();
      const tag = document.getElementById('fw_tag').value.trim();
      const status = document.getElementById('status');

      if (!owner || !repo || !token) {
        status.innerHTML = '❌ Заполни Owner, Репозиторий и GitHub Token.';
        return;
      }

      ['gh_owner','gh_repo','gh_token','fw_tag'].forEach(id => localStorage.setItem(id, document.getElementById(id).value.trim()));
      const cfg = getConfig();
      localStorage.setItem('last_board_cfg', JSON.stringify(cfg));

      const btn = document.getElementById('buildBtn');
      btn.disabled = true;
      status.innerHTML = '⏳ Отправка задания в GitHub Actions...';

      try {
        const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/workflows/build.yml/dispatches`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/vnd.github+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            ref: 'main',
            inputs: {
              meshtastic_tag: tag,
              board_config: JSON.stringify(cfg)
            }
          })
        });

        if (res.status === 204) {
          status.innerHTML = `✅ Сборка запущена! Через 3–5 минут архив с прошивкой появится в Artifacts: <a href="https://github.com/${owner}/${repo}/actions" target="_blank">Открыть GitHub Actions →</a>`;
        } else {
          const err = await res.json();
          status.innerHTML = `❌ Ошибка GitHub API (${res.status}): ${err.message}`;
        }
      } catch (e) {
        status.innerHTML = `❌ Ошибка сети: ${e.message}`;
      } finally {
        btn.disabled = false;
      }
    }

    function exportJson() {
      const data = JSON.stringify(getConfig(), null, 2);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([data], {type: 'application/json'}));
      a.download = `meshtastic-${document.getElementById('mcu').value}.json`;
      a.click();
    }

    function importJson() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = e => {
        const reader = new FileReader();
        reader.onload = ev => {
          const cfg = JSON.parse(ev.target.result);
          FIELDS.forEach(id => { if (cfg[id] !== undefined) document.getElementById(id).value = cfg[id]; });
          updateHints();
          toggleFields();
        };
        reader.readAsText(e.target.files[0]);
      };
      input.click();
    }

    loadSaved();
  </script>
</body>
</html>
